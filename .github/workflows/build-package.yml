name: Build MSYS2 package

on:
  workflow_call:
    inputs:
      package_name:
        description: "Package name to build"
        type: string
      packages_repository:
        description: "MSYS2 packages repository to build from"
        type: string
        default: "Windows-on-ARM-Experiments/MSYS2-packages"
      packages_branch:
        description: "MSYS2 packages branch to build from"
        type: string
        default: "woarm64"
      runner_arch:
        description: "Runner hardware architecture, not build-dependency architecture"
        type: string
        default: "x86_64"
      native_runner:
        description: "ARM64 runner: self-hosted or windows-11-arm"
        type: string
        default: self-hosted
      build_with_native:
        description: "Build with native MinGW toolchain"
        type: boolean
        default: false
      build_jobs:
        description: "Explicit build/test worker limit (1-16); package compression uses one thread"
        type: number
        default: 2
      needs:
        description: "Parent workflow job dependencies"
        type: string
      dependencies:
        description: "Install additional dependencies"
        type: string
        default: ""

defaults:
  run:
    shell: msys2 {0}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLAVOR: ${{ (inputs.runner_arch == 'aarch64') && (inputs.build_with_native && 'NATIVE_WITH_NATIVE' || 'NATIVE_WITH_CROSS') || 'CROSS' }}
  CLEAN_BUILD: 1
  WOARM64_JOBS: ${{ inputs.build_jobs }}

jobs:
  build:
    name: Build ${{ inputs.package_name }}
    timeout-minutes: ${{ inputs.runner_arch == 'aarch64' && inputs.native_runner == 'self-hosted' && 720 || 360 }}
    runs-on: >-
      ${{ fromJson(inputs.runner_arch == 'aarch64'
        && (inputs.native_runner == 'windows-11-arm' && '["windows-11-arm"]' || '["Windows", "ARM64", "MSYS2"]')
        || '["windows-latest"]') }}

    steps:
      - name: Validate requested build host
        shell: pwsh
        env:
          REQUESTED_ARCH: ${{ inputs.runner_arch }}
          REQUESTED_RUNNER: ${{ inputs.native_runner }}
        run: |
          if ($env:REQUESTED_ARCH -notin @('x86_64', 'aarch64')) {
            throw "Unsupported runner_arch: $env:REQUESTED_ARCH"
          }
          if ($env:WOARM64_JOBS -notmatch '^([1-9]|1[0-6])$') {
            throw 'build_jobs must be an integer from 1 to 16.'
          }
          if ($env:REQUESTED_RUNNER -notin @('self-hosted', 'windows-11-arm')) {
            throw "Unsupported native_runner: $env:REQUESTED_RUNNER"
          }
          if ($env:REQUESTED_ARCH -eq 'aarch64' -and [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'The native-output lane requires ARM64 Windows hardware.'
          }
          Write-Output "Runner hardware: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture); MSYS/x64 helpers remain bootstrap tools."

      - name: Kill hanging processes
        if: inputs.runner_arch == 'aarch64' && inputs.native_runner == 'self-hosted'
        shell: powershell
        run: |
          taskkill /F /FI 'MODULES eq msys-2.0.dll'
          Set-Location "${{ github.workspace }}"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -Path packages
          exit 0

      - uses: Windows-on-ARM-Experiments/setup-msys2@813d75cc630f7932cf669c1e9cb7fcf1c435741c
        timeout-minutes: 10
        with:
          msystem: >-
            ${{ contains(inputs.packages_repository, 'MINGW')
              && ((inputs.runner_arch == 'aarch64') && 'MINGWARM64' || 'MINGW64')
              || 'MSYS' }}
          path-type: minimal
          update: true
          cache: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout ${{ inputs.packages_repository }} repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.packages_repository }}
          ref: ${{ ((inputs.runner_arch == 'aarch64') && !inputs.build_with_native) && format('{0}-cross', inputs.packages_branch) || inputs.packages_branch }}
          sparse-checkout: ${{ inputs.package_name }}
          path: ${{ github.workspace }}/packages

      - name: Setup packages repository
        if: inputs.runner_arch == 'aarch64'
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/setup-repository.sh

      - name: Install dependencies
        run: >-
          `cygpath "${{ github.workspace }}"`/.github/scripts/install-dependencies.sh \
            "git mingw-w64-x86_64-github-cli mingw-w64-x86_64-jq ${{ inputs.dependencies }}"

      - name: Download artifacts
        if: inputs.needs
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/download-artifacts.sh \
            ${{ github.run_id }} \
            '${{ inputs.needs }}'

      - name: Install artifacts
        if: inputs.needs
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/install-artifacts.sh

      - name: Copy missing headers for mingw-w64-cross-mingwarm64-crt
        if: inputs.package_name == 'mingw-w64-cross-mingwarm64-crt'
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/pthread-headers-hack-before.sh

      - name: Setup MINGWARM64 environment
        if: inputs.runner_arch == 'aarch64'
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/setup-mingwarm64.sh

      - name: Enable Ccache
        id: enable-ccache
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/enable-ccache.sh

      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.FLAVOR }}-${{ inputs.package_name }}-${{ hashFiles('patches/ccache/**', 'patches/makepkg/**', '.github/scripts/enable-ccache.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.FLAVOR }}-${{ inputs.package_name }}-${{ hashFiles('patches/ccache/**', 'patches/makepkg/**', '.github/scripts/enable-ccache.sh') }}-

      - name: Build ${{ inputs.package_name }}
        timeout-minutes: ${{ inputs.runner_arch == 'aarch64' && inputs.native_runner == 'self-hosted' && 720 || 360 }}
        working-directory: ${{ github.workspace }}/packages/${{ inputs.package_name }}
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/build-package.sh \
            ${{ inputs.packages_repository }} 2>&1 | tee build-output.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-${{ env.FLAVOR }}-evidence
          retention-days: 7
          path: ${{ github.workspace }}/packages/${{ inputs.package_name }}/*.log

      - name: Save Ccache
        if: ${{ !cancelled() && steps.enable-ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.FLAVOR }}-${{ inputs.package_name }}-${{ hashFiles('patches/ccache/**', 'patches/makepkg/**', '.github/scripts/enable-ccache.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload ${{ inputs.package_name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}
          retention-days: 3
          path: ${{ github.workspace }}/packages/${{ inputs.package_name }}/*.pkg.tar.zst

      - name: Upload build folder
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-build
          retention-days: 1
          path: ${{ github.workspace }}/packages/${{ inputs.package_name }}/src
