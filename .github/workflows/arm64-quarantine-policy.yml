name: Protected ARM64 policy enforcement

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: arm64-governance
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Bind GitHub-owned event identity
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: crutkas/msys2-woarm64-build
          EXPECTED_REF: refs/heads/main
          EXPECTED_WORKFLOW_REF: crutkas/msys2-woarm64-build/.github/workflows/arm64-quarantine-policy.yml@refs/heads/main
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw |
            ConvertFrom-Json -Depth 32
          if ($env:GITHUB_EVENT_NAME -cne 'pull_request_target' -or
              $env:GITHUB_REPOSITORY -cne $env:EXPECTED_REPOSITORY -or
              $env:GITHUB_REF -cne $env:EXPECTED_REF -or
              $env:GITHUB_WORKFLOW_REF -cne $env:EXPECTED_WORKFLOW_REF -or
              $event.pull_request.base.repo.full_name -cne $env:EXPECTED_REPOSITORY -or
              $event.pull_request.base.ref -cne 'main' -or
              $event.pull_request.base.sha -notmatch '^[0-9a-f]{40}$' -or
              $event.pull_request.head.sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Untrusted or incomplete protected verifier context.'
          }
          if ($event.pull_request.head.sha -ceq $event.pull_request.merge_commit_sha) {
            throw 'Synthetic merge input is forbidden.'
          }

      - name: Checkout exact protected base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          persist-credentials: false

      - name: Provision provenance-bound Git
        shell: pwsh
        working-directory: verifier
        run: |
          $ErrorActionPreference = 'Stop'
          $assetUrl = 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/Git-2.55.0.3-64-bit.exe'
          $assetSha256 = 'af12577d0fdff74243a5988197aa49b957d5044edc17004f6ddf0768996f1dca'
          $signerThumbprint = '3e9627155b7a6f29856321ee56d7fc25cf808407'
          $launcherSha256 = '7b7971dd13f0c3a284e538601f2f9770b3a87dfaccb5fb52d68141c67ed22364'
          $engineSha256 = '1a0043555d254618f2d56c936c3d9a1fbfb878bc878416a133c346bc7835eda9'
          $assetPath = Join-Path $env:RUNNER_TEMP 'Git-2.55.0.3-64-bit.exe'
          $gitRoot = Join-Path $env:RUNNER_TEMP 'Git-2.55.0.3-x64'

          Invoke-WebRequest -Uri $assetUrl -OutFile $assetPath
          if ((Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              $assetSha256) {
              throw 'Git-for-Windows release asset digest mismatch.'
          }
          $assetSignature = Get-AuthenticodeSignature -LiteralPath $assetPath
          if ($assetSignature.Status -ne 'Valid' -or
              $null -eq $assetSignature.SignerCertificate -or
              $assetSignature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne
                  $signerThumbprint) {
              throw 'Git-for-Windows release asset signature mismatch.'
          }
          if (Test-Path -LiteralPath $gitRoot) {
              throw 'Isolated Git-for-Windows destination already exists.'
          }

          $installer = Start-Process -FilePath $assetPath -ArgumentList @(
              '/VERYSILENT',
              '/NORESTART',
              '/NOCANCEL',
              '/SUPPRESSMSGBOXES',
              '/SP-',
              '/NOICONS',
              "/DIR=$gitRoot"
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
              throw "Git-for-Windows installer exited with code $($installer.ExitCode)."
          }
          $launcherPath = Join-Path $gitRoot 'cmd\git.exe'
          $enginePath = Join-Path $gitRoot 'mingw64\bin\git.exe'
          foreach ($identity in @(
                  @{ Path = $launcherPath; Sha256 = $launcherSha256 },
                  @{ Path = $enginePath; Sha256 = $engineSha256 })) {
              if (-not (Test-Path -LiteralPath $identity.Path -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $identity.Path -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                      $identity.Sha256 -or
                  [Diagnostics.FileVersionInfo]::GetVersionInfo($identity.Path).ProductVersion -cne
                      '2.55.0.windows.3') {
                  throw 'Installed Git-for-Windows runtime identity mismatch.'
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $identity.Path
              if ($signature.Status -ne 'Valid' -or
                  $null -eq $signature.SignerCertificate -or
                  $signature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne
                      $signerThumbprint) {
                  throw 'Installed Git-for-Windows runtime signature mismatch.'
              }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ARM64_GIT_EXECUTABLE=$launcherPath"

      - name: Install parser dependencies
        shell: pwsh
        working-directory: verifier
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify protected source identity
        shell: pwsh
        working-directory: verifier
        run: ./.github/scripts/verify-protected-context.ps1

      - name: Collect candidate files as API data
        shell: pwsh
        working-directory: verifier
        run: ./.github/scripts/collect-pr-workflow-data.ps1

      - name: Audit candidate data semantically
        shell: pwsh
        working-directory: verifier
        run: ./.github/scripts/audit-arm64-workflows.ps1
