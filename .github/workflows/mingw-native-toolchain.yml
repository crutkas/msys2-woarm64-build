  mingw-w64-binutils:
    needs: [
      mingw-w64-libiconv,
      mingw-w64-libtre,
      mingw-w64-libsystre,
      mingw-w64-ncurses,
      mingw-w64-gettext,
      mingw-w64-headers-git,
      mingw-w64-winpthreads-git,
      mingw-w64-bzip2,
      mingw-w64-zlib,
      mingw-w64-zstd,
      mingw-w64-gmp,
      mingw-w64-mpfr,
      mingw-w64-isl
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-binutils
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
