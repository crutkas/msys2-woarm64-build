name: Build MinGW native toolchain

on:
  workflow_dispatch:
    inputs:
      mingw_packages_branch:
        description: "MINGW-packages branch to build"
        type: string
        required: false
        default: "woarm64"
      build_with_native:
        description: "Build with native MinGW toolchain"
        type: choice
        options:
          - true
          - false
        required: false
        default: 'true'
      native_runner:
        description: "ARM64 runner (not the architecture of every build dependency)"
        type: choice
        options:
          - self-hosted
          - windows-11-arm
        default: self-hosted
  workflow_call:
    inputs:
      mingw_packages_branch:
        description: "MINGW-packages branch to build"
        type: string
        default: "woarm64"
      build_with_native:
        description: "Build with native MinGW toolchain"
        type: string
        required: false
        default: 'true'
      native_runner:
        description: "self-hosted or windows-11-arm"
        type: string
        default: self-hosted
    outputs:
      artifacts:
        value: ${{ toJson(jobs) }}

# Keep this distinct from the caller and the cross-toolchain workflow.
concurrency:
  group: ${{ github.workflow }}-mingw-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-w64-libiconv:
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-libiconv
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}

  mingw-w64-libtre:
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-libtre
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}

  mingw-w64-libsystre:
    needs: [
      mingw-w64-libtre
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-libsystre
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}
      needs: ${{ toJson(needs) }}

  mingw-w64-gettext:
    needs: [
      mingw-w64-libiconv,
      mingw-w64-libtre,
      mingw-w64-libsystre
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-gettext
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}
      needs: ${{ toJson(needs) }}

  mingw-w64-ncurses:
    needs: [
      mingw-w64-libiconv,
      mingw-w64-libtre,
      mingw-w64-libsystre,
      mingw-w64-gettext
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-ncurses
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}
      needs: ${{ toJson(needs) }}

  mingw-w64-headers-git:
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-headers-git
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}

  mingw-w64-crt-git:
    needs: [
      mingw-w64-headers-git
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-crt-git
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}
      needs: ${{ toJson(needs) }}

  mingw-w64-winpthreads-git:
    needs: [
      mingw-w64-headers-git,
      mingw-w64-crt-git
    ]
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-winpthreads-git
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
      build_with_native: ${{ inputs.build_with_native != 'false' }}
      needs: ${{ toJson(needs) }}

  mingw-w64-bzip2:
    uses: ./.github/workflows/build-package.yml
    with:
      package_name: mingw-w64-bzip2
      packages_repository: Windows-on-ARM-Experiments/MINGW-packages
      packages_branch: ${{ inputs.mingw_packages_branch || 'woarm64' }}
      runner_arch: aarch64
      native_runner: ${{ inputs.native_runner || 'self-hosted' }}
