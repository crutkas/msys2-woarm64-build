name: ARM64 metadata-only admission

on:
  workflow_dispatch:
    inputs:
      metadata:
        description: "Complete ARM64 candidate metadata envelope (JSON)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Reject incomplete metadata before checkout
    runs-on: windows-latest
    env:
      ADMISSION_METADATA: ${{ inputs.metadata }}
    steps:
      - name: Verify all metadata is present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = $env:ADMISSION_METADATA | ConvertFrom-Json -Depth 32
          $requiredPaths = @(
            'schema_version',
            'admission.mode',
            'admission.evaluated_at',
            'safety.network',
            'safety.setup',
            'safety.download',
            'safety.install',
            'safety.package',
            'safety.build',
            'safety.artifact_consumption',
            'safety.payload_assembly',
            'safety.native_execution',
            'safety.release_publish',
            'safety.release_settings_change',
            'safety.candidate_output',
            'baseline.repository',
            'baseline.release.id',
            'baseline.release.immutable',
            'baseline.release.state',
            'baseline.release.draft',
            'baseline.release.prerelease',
            'baseline.release.tag_name',
            'baseline.tag.name',
            'baseline.tag.object_type',
            'baseline.tag.object_sha',
            'baseline.tag.peeled_commit',
            'baseline.asset.id',
            'baseline.asset.name',
            'baseline.asset.size',
            'baseline.asset.sha256',
            'producer.repository',
            'producer.commit',
            'producer.tree',
            'producer.parents',
            'producer.commit_message',
            'workflow.path',
            'workflow.blob',
            'workflow.actions',
            'workflow.actions.actions/checkout',
            'workflow.actions.msys2/setup-msys2',
            'workflow.actions.actions/upload-artifact',
            'workflow.actions.actions/download-artifact',
            'workflow.actions.actions/cache/restore',
            'workflow.actions.actions/cache/save',
            'workflow.actions.actions/upload-pages-artifact',
            'workflow.actions.actions/configure-pages',
            'workflow.actions.actions/deploy-pages',
            'run.id',
            'run.attempt',
            'run.job',
            'run.event_name',
            'run.ref',
            'run.head_sha',
            'artifact.id',
            'artifact.name',
            'artifact.size',
            'artifact.digest',
            'artifact.expires_at',
            'runtime.release.id',
            'runtime.release.immutable',
            'runtime.commit',
            'runtime.ancestors',
            'binutils.release.id',
            'binutils.release.immutable',
            'binutils.package_sha256',
            'revocation_checks',
            'revocation_checks.runtime_commit_and_descendants',
            'revocation_checks.runtime_release',
            'revocation_checks.binutils_release',
            'revocation_checks.binutils_package_sha256',
            'workspace.root',
            'workspace.shared_root_observed',
            'workspace.shared_root_transaction'
          )

          function Test-Path {
            param([object]$Root, [string]$Path)

            $current = $Root
            foreach ($segment in $Path.Split('.')) {
              if ($null -eq $current) {
                return $false
              }
              $property = $current.PSObject.Properties[$segment]
              if ($null -eq $property) {
                return $false
              }
              $current = $property.Value
            }

            return $null -ne $current -and
              ($current -isnot [string] -or -not [string]::IsNullOrWhiteSpace($current))
          }

          $missing = @($requiredPaths | Where-Object { -not (Test-Path $metadata $_) })
          if ($missing.Count -ne 0) {
            throw "Incomplete ARM64 admission metadata: $($missing -join ', ')"
          }

  validate:
    name: Validate quarantine and provenance policy
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Evaluate metadata only
        shell: pwsh
        env:
          ADMISSION_METADATA: ${{ inputs.metadata }}
        run: |
          & .\.github\scripts\arm64-admission.ps1 -MetadataJson $env:ADMISSION_METADATA
