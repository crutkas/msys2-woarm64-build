name: Check MSYS2 repository

on:
  workflow_dispatch:
    inputs:
      native_runner:
        description: "ARM64 runner"
        type: choice
        options:
          - self-hosted
          - windows-11-arm
        default: self-hosted
  workflow_call:
    inputs:
      native_runner:
        description: "self-hosted or windows-11-arm"
        type: string
        default: self-hosted

concurrency:
  group: ${{ github.workflow }}-check-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cross:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    env:
      FLAVOR: CROSS

    steps:
      - uses: msys2/setup-msys2@v2
        timeout-minutes: 10
        with:
          msystem: MSYS
          path-type: minimal
          update: true
          cache: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup packages repository
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/setup-repository.sh

      - name: Install cross toolchain
        run: |
          pacman -S --noconfirm mingw-w64-cross-mingwarm64-gcc
          pacman -S --noconfirm --needed mingw-w64-aarch64-cc

      - name: Build hello-world.exe
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/build-hello-world.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-cross
          path: hello-world.exe

  test-cross:
    needs: [build-cross]
    runs-on: ${{ fromJson(inputs.native_runner == 'windows-11-arm' && '["windows-11-arm"]' || '["Windows", "GCC", "ARM64"]') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello-world-cross
          path: ${{ github.workspace }}\artifacts

      - name: Run hello-world.exe
        run: |
          ${{ github.workspace }}\artifacts\hello-world.exe

  build-native:
    runs-on: ${{ fromJson(inputs.native_runner == 'windows-11-arm' && '["windows-11-arm"]' || '["Windows", "ARM64", "MSYS2"]') }}

    defaults:
      run:
        shell: msys2 {0}

    env:
      FLAVOR: NATIVE_WITH_NATIVE

    steps:
      - name: Kill hanging processes
        if: inputs.native_runner == 'self-hosted'
        shell: powershell
        run: |
          taskkill /F /FI 'MODULES eq msys-2.0.dll'
          Set-Location "${{ github.workspace }}"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -Path packages
          exit 0

      - uses: Windows-on-ARM-Experiments/setup-msys2@813d75cc630f7932cf669c1e9cb7fcf1c435741c
        timeout-minutes: 10
        with:
          msystem: MINGWARM64
          path-type: minimal
          update: true
          cache: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup packages repository
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/setup-repository.sh

      - name: Install native toolchain
        run: |
          pacman -S --noconfirm mingw-w64-aarch64-gcc
          pacman -S --noconfirm --needed mingw-w64-aarch64-cc

      - name: Setup MINGWARM64 environment
        run: |
            `cygpath "${{ github.workspace }}"`/.github/scripts/setup-mingwarm64.sh

      - name: Build hello-world.exe
        run: |
          `cygpath "${{ github.workspace }}"`/.github/scripts/build-hello-world.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-native
          path: hello-world.exe
         
  test-native:
    needs: [build-native]
    runs-on: ${{ fromJson(inputs.native_runner == 'windows-11-arm' && '["windows-11-arm"]' || '["Windows", "GCC", "ARM64"]') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hello-world-native
          path: ${{ github.workspace }}\artifacts

      - name: Run hello-world.exe
        run: |
          ${{ github.workspace }}\artifacts\hello-world.exe
